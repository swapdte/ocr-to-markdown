[project]
name = "ocr-to-markdown"
version = "1.19.0"
description = "OCR zu Markdown Konverter mit TUI-Dateiauswahl"
requires-python = ">=3.10"
authors = [
    { name = "Marc Kerkmann" },
]
maintainers = [
    { name = "opencode" },
]
license = { text = "MIT" }
dependencies = [
    "questionary",
    "rich",
    "pymupdf",
    "pillow",
]

[project.scripts]
ocr-to-markdown = "ocr_to_markdown:main"

[tool.setuptools]
py-modules = ["ocr_to_markdown"]